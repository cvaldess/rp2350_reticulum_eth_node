; rp2350_reticulum_eth_node — standalone Reticulum transport node
; RP2350 + WIZnet W5500 Ethernet + EBYTE E22-900M30S (SX1262) + NXP SE050E
;
; Two carriers, same pinout (include/board_pins.h), different flash:
;   pico2_w5500_e22            Raspberry Pi Pico 2 (4 MB) on the DIY carrier, external W5500 module
;   wiznet_5500_evb_pico2_e22p WIZnet W5500-EVB-Pico2 (2 MB) on the KiCad carrier, W5500 on-board

[platformio]
default_envs = pico2_w5500_e22

[base]
; Same platform + core pin as the Meshtastic RP2350 builds on this machine, so the
; toolchain, framework and picotool are already cached by PlatformIO.
platform = https://github.com/maxgerhardt/platform-raspberrypi#cc24cfef37ed22ca9f2a6aead28c2deb76c39f24
platform_packages =
  arduino-pico@https://github.com/earlephilhower/arduino-pico/releases/download/5.4.4/rp2040-5.4.4.zip
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
monitor_speed = 115200

build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wno-missing-field-initializers -Wno-format -Wno-unused-variable -Wno-unused-but-set-variable
  -Wno-unused-function -Wno-unused-parameter
  ; microReticulum throws and catches (18 files). arduino-pico only links the
  ; exception-capable libstdc++ when this macro is present (tools/platformio-build.py).
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
  ; --- microReticulum ---
  -D RNS_USE_FS
  -D RNS_LOG_LEVEL=RNS_LOG_LEVEL_DEBUG
  -D RNS_LOW_MEMORY_REBOOT
  -D RNS_NEIGHBOR_PATH_REQUEST=1
  ; --- microStore ---
  ; The upstream LittleFS adapter is ESP32-flavoured (LittleFS.begin(bool, path),
  ; totalBytes()/usedBytes(), FILE_* macros). src/PicoLittleFSFileSystem.h is the
  ; arduino-pico version; no USTORE_USE_* adapter is selected here on purpose.
  -D USTORE_ENABLE_LOG
  -I include

lib_deps =
  https://github.com/attermann/microReticulum.git#0.5.0
  https://github.com/attermann/microStore.git
  https://github.com/attermann/Crypto.git
  bblanchon/ArduinoJson@^7.4.2
  hideakitai/MsgPack@^0.4.2
  ; W5500 (same library the Meshtastic port uses on this carrier)
  arduino-libraries/Ethernet@^2.0.2
  ; SX1262 (same RadioLib pin as the Meshtastic port)
  https://github.com/jgromes/RadioLib/archive/10e7925db2727e1f5c1c796191905d0a7d955eec.zip

; Bench 1 (COM64): Pico 2, 4 MB flash. Transport node with TCP + LoRa.
[env:pico2_w5500_e22]
extends = base
board = rpipico2
; LittleFS: transport identity, path table, known destinations, OTA staging (later).
board_build.filesystem_size = 1m
build_flags =
  ${base.build_flags}
  ; SE050 ENA on GP7: only on this carrier, which has the hardware mod (pin 11/12 bridge cut,
  ; 6.8k to 3V3 + 47nF). Never define it on a board that ties ENA to VIN.
  -D SE050_ENA_PIN=7

; Bench 2 (COM9): W5500-EVB-Pico2, 2 MB flash. LoRa-only for phase 2 so every packet it
; exchanges with bench 1 has to cross the air.
[env:wiznet_5500_evb_pico2_e22p]
extends = base
board = wiznet_5500_evb_pico2
board_build.filesystem_size = 0.5m
build_flags =
  ${base.build_flags}
  -D NODE_DISABLE_TCP
